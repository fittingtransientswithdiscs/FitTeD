name: publish

# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing: GitHub proves this repository's identity to
# PyPI directly over OIDC, so there is no API token anywhere -- nothing to
# create, store, rotate or leak.
#
# The PyPI side must be configured once, under Account settings -> Publishing:
#   PyPI project name : astro-fitted
#   Owner             : fittingtransientswithdiscs
#   Repository        : FitTeD
#   Workflow          : publish.yml
#   Environment       : pypi
#
# The import name stays `fitted`; astro-fitted is only the distribution name,
# because plain "fitted" is taken on PyPI by an unrelated package.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build twine
          python -m build

      - name: Check the artefacts
        # twine check validates the long_description renders on PyPI -- a
        # broken README is the classic way to get an ugly project page.
        run: |
          ls -l dist/
          python -m twine check dist/*
          for w in dist/*.whl; do
            case "$w" in
              *-py3-none-any.whl) echo "OK universal wheel: $w" ;;
              *) echo "NOT universal: $w"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for Trusted Publishing. Job level, not workflow level.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
